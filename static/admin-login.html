<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>MovieTube Stats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --bg: #0b0b0f; --surface: #15151c; --border: #2a2a3a; --text: #f2f2f5; --muted: #8c8c9c; --brand: #e5484d; --bad: #ff7a7d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif; }
    form { width: min(360px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px; }
    h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.4px; }
    h1 span { color: var(--brand); }
    p { color: var(--muted); margin: 0 0 22px; font-size: 14px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input { width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--border); background: #0f0f15; color: var(--text); font: inherit; }
    input:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: transparent; }
    button { width: 100%; margin-top: 16px; padding: 11px; border: 0; border-radius: 8px; background: var(--brand); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #ff6369; }
    .err { color: var(--bad); font-size: 13px; margin: 10px 0 0; }
    a { display: block; text-align: center; margin-top: 18px; color: var(--muted); font-size: 13px; text-decoration: none; }
    a:hover { color: var(--text); }
  </style>
</head>
<body>
  <form method="post" action="/admin/login">
    <h1>Movie<span>Tube</span> Stats</h1>
    <p>Enter the admin password to see your site's stats.</p>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <p class="err" id="err" hidden></p>
    <button type="submit">Log in</button>
    <a href="/">← Back to MovieTube</a>
  </form>
  <script>
    const e = new URLSearchParams(location.search).get("e");
    const msg = { wrong: "Wrong password. Try again.", locked: "Too many wrong tries. Wait 10 minutes and try again." }[e];
    if (msg) { const el = document.getElementById("err"); el.textContent = msg; el.hidden = false; history.replaceState(null, "", "/admin"); }
  </script>
</body>
</html>
