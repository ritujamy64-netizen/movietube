<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>MovieTube Stats</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2315151c'/><path d='M7 22v-6M13 22V10M19 22v-9M25 22V6' stroke='%233987e5' stroke-width='3' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0f;
      --surface-1: #15151c;
      --surface-2: #1f1f29;
      --border: #26263a;
      --text-primary: #f2f2f5;
      --text-secondary: #b4b4c2;
      --text-muted: #7c7c8c;
      --grid: #24242f;
      --series-visitors: #3987e5;  /* validated vs --surface-1 */
      --series-plays: #199e70;
      --good: #46d37e;
      --bad: #ff7a7d;
      --brand: #e5484d;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text-primary); font: 14px/1.5 Inter, system-ui, sans-serif; }
    a { color: inherit; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 60px; }
    header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
    header h1 { font-size: 20px; margin: 0; letter-spacing: -.3px; }
    header h1 span { color: var(--brand); }
    .live { display: inline-flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 13px; }
    .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 4px rgba(70,211,126,.15); }
    .range { margin-left: auto; display: flex; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
    .range button { border: 0; background: none; color: var(--text-secondary); font: inherit; font-weight: 500; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .range button[aria-pressed="true"] { background: var(--surface-2); color: var(--text-primary); }
    .back { color: var(--text-muted); text-decoration: none; font-size: 13px; }
    .back:hover { color: var(--text-primary); }

    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 12px; margin-bottom: 12px; }
    .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }
    .kpi .label { color: var(--text-secondary); font-size: 13px; }
    .kpi .value { font-size: 32px; font-weight: 700; letter-spacing: -1px; margin: 2px 0; font-variant-numeric: tabular-nums; }
    .kpi .delta { font-size: 12px; color: var(--text-muted); }
    .delta b { font-weight: 600; }
    .up { color: var(--good); } .down { color: var(--bad); }

    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 12px; margin-bottom: 12px; }
    .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; margin-bottom: 12px; }
    h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
    .sub { color: var(--text-muted); font-size: 12px; margin: 0 0 14px; }

    .chart { position: relative; }
    .chart svg { display: block; width: 100%; height: 220px; overflow: visible; }
    .chart .axis text { fill: var(--text-muted); font-size: 11px; font-family: inherit; }
    .chart .gridline { stroke: var(--grid); stroke-width: 1; }
    .tip { position: absolute; pointer-events: none; background: #0b0b0f; border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; font-size: 12px; white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
    .tip .d { color: var(--text-muted); }
    .tip .v { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .tip .v i { width: 8px; height: 8px; border-radius: 2px; }
    details { margin-top: 10px; color: var(--text-muted); font-size: 12px; }
    details summary { cursor: pointer; }
    details table { margin-top: 8px; }

    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th { text-align: left; font-weight: 500; color: var(--text-muted); font-size: 12px; padding: 0 8px 8px 0; border-bottom: 1px solid var(--border); }
    td { padding: 9px 8px 9px 0; border-bottom: 1px solid #1c1c26; vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    th.n, td.n { text-align: right; }
    td.name { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    td.name small { color: var(--text-muted); }
    .meter { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
    .meter span { width: 64px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
    .meter span i { display: block; height: 100%; border-radius: 3px; background: var(--series-plays); }

    .bars { display: grid; gap: 6px; }
    .bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; position: relative; padding: 6px 8px; border-radius: 6px; }
    .bar::before { content: ""; position: absolute; inset: 0; width: var(--w); background: rgba(57,135,229,.16); border-radius: 6px; }
    .bar span { position: relative; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar b { position: relative; font-weight: 600; font-variant-numeric: tabular-nums; }
    .empty { color: var(--text-muted); font-size: 13px; padding: 12px 0; }
    .tscroll { overflow-x: auto; }
    .tscroll table { min-width: 520px; }
    @media (max-width: 520px) { .kpi .value { font-size: 26px; } .kpis { grid-template-columns: 1fr 1fr; } .range { margin-left: 0; } }
    .msg { text-align: center; padding: 80px 16px; color: var(--text-secondary); }
    .note { color: var(--text-muted); font-size: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Movie<span>Tube</span> Stats</h1>
      <span class="live" id="live"></span>
      <div class="range" role="group" aria-label="Date range">
        <button data-days="1">Today</button>
        <button data-days="7">7 days</button>
        <button data-days="30" aria-pressed="true">30 days</button>
        <button data-days="90">90 days</button>
      </div>
      <a class="back" href="/">← Back to site</a>
      <form method="post" action="/admin/logout" style="margin:0"><button class="back" style="background:none;border:0;cursor:pointer;font:inherit">Log out</button></form>
    </header>
    <main id="main"><p class="msg">Loading…</p></main>
    <p class="note">Anonymous, first-party stats. Visitors get no cookies and no IP addresses are stored; each browser gets a random ID. Times are UTC.</p>
  </div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n, d = 0) => Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: d });
const fmtHours = (h) => h >= 10 ? fmt(h, 0) : h >= 1 ? fmt(h, 1) : `${fmt(h * 60, 0)} min`;
const dayLabel = (d, long) => new Date(d + "T00:00:00Z").toLocaleDateString(undefined, long ? { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" } : { month: "short", day: "numeric", timeZone: "UTC" });
let days = 30;
let data = null;

function delta(cur, prev) {
  if (!prev) return cur ? `<span class="delta">new this period</span>` : `<span class="delta">no data before</span>`;
  const pct = ((cur - prev) / prev) * 100;
  const cls = pct > 0.5 ? "up" : pct < -0.5 ? "down" : "";
  const arrow = pct > 0.5 ? "▲" : pct < -0.5 ? "▼" : "■";
  return `<span class="delta"><b class="${cls}">${arrow} ${fmt(Math.abs(pct))}%</b> vs previous ${days === 1 ? "day" : `${days} days`}</span>`;
}

function kpi(label, value, cur, prev) {
  return `<div class="card kpi"><div class="label">${label}</div><div class="value">${value}</div>${delta(cur, prev)}</div>`;
}

function barList(items, { label = (r) => r.label, value = (r) => r.n, empty = "Nothing yet." } = {}) {
  if (!items.length) return `<p class="empty">${empty}</p>`;
  const max = Math.max(...items.map(value)) || 1;
  return `<div class="bars">${items.map((r) => `<div class="bar" style="--w:${(value(r) / max) * 100}%"><span title="${esc(label(r))}">${esc(label(r))}</span><b>${fmt(value(r))}</b></div>`).join("")}</div>`;
}

function filmTable(films, empty) {
  if (!films.length) return `<p class="empty">${empty}</p>`;
  return `<div class="tscroll"><table><thead><tr><th>Film</th><th class="n">Plays</th><th class="n">Viewers</th><th class="n">Watch time</th><th class="n">Avg. watched</th></tr></thead><tbody>
    ${films.map((f) => `<tr>
      <td class="name" title="${esc(f.name)}"><a href="/#/title/${f.id}" target="_blank" rel="noopener">${esc(f.name)}</a>${f.year ? ` <small>${f.year}</small>` : ""}</td>
      <td class="n">${fmt(f.plays)}</td><td class="n">${fmt(f.viewers)}</td><td class="n">${fmtHours(f.watch_hours)}${f.watch_hours >= 1 ? " h" : ""}</td>
      <td class="n">${f.completion == null ? "–" : `<div class="meter">${fmt(f.completion)}%<span><i style="width:${Math.min(100, f.completion)}%"></i></span></div>`}</td>
    </tr>`).join("")}</tbody></table></div>`;
}

/* ---- time-series chart (single series, one axis) with hover tooltip ---- */
function timeChart(el, rows, key, { color, kind, label, format = (v) => fmt(v) }) {
  const W = Math.max(280, el.clientWidth), H = 220, m = { t: 10, r: 8, b: 26, l: 36 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const vals = rows.map((r) => r[key]);
  const niceMax = (v) => { if (v <= 4) return 4; const p = 10 ** Math.floor(Math.log10(v)); return Math.ceil(v / p) * p; };
  const max = niceMax(Math.max(...vals, 0));
  const n = rows.length;
  const step = iw / n;
  const x = (i) => m.l + step * i + step / 2;
  const y = (v) => m.t + ih - (v / max) * ih;
  const ticks = [0, max / 2, max];
  const every = Math.ceil(n / Math.max(2, Math.floor(iw / 70)));
  let marks = "";
  if (kind === "bar") {
    const bw = Math.max(2, Math.min(28, step - 2));
    marks = rows.map((r, i) => {
      const h = Math.max(0, (r[key] / max) * ih);
      if (!h) return "";
      const rx = Math.min(4, bw / 2, h);
      const x0 = x(i) - bw / 2, y0 = m.t + ih - h;
      // rounded top only, anchored flat to the baseline
      return `<path d="M${x0},${m.t + ih} V${y0 + rx} Q${x0},${y0} ${x0 + rx},${y0} H${x0 + bw - rx} Q${x0 + bw},${y0} ${x0 + bw},${y0 + rx} V${m.t + ih} Z" style="fill:${color}"/>`;
    }).join("");
  } else {
    const pts = rows.map((r, i) => `${x(i)},${y(r[key])}`).join(" L");
    marks = `<path d="M${x(0)},${m.t + ih} L${pts} L${x(n - 1)},${m.t + ih} Z" style="fill:${color}" opacity=".14"/>
             <path d="M${pts}" fill="none" style="stroke:${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (n === 1) marks += `<circle cx="${x(0)}" cy="${y(vals[0])}" r="4" style="fill:${color}"/>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} per day">
    <g class="axis">${ticks.map((t) => `<line class="gridline" x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/><text x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end">${fmt(t)}</text>`).join("")}
      ${rows.map((r, i) => i % every === 0 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${dayLabel(r.day)}</text>` : "").join("")}</g>
    ${marks}
    <line class="xh" y1="${m.t}" y2="${m.t + ih}" stroke="#555" stroke-width="1" visibility="hidden"/>
    ${kind === "bar" ? "" : `<circle class="dot" r="5" style="fill:${color}" stroke="#15151c" stroke-width="2" visibility="hidden"/>`}
    <rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/>
  </svg><div class="tip" hidden></div>`;
  const svg = $("svg", el), tip = $(".tip", el), xh = $(".xh", el), dot = $(".dot", el);
  const move = (ev) => {
    const pt = svg.getBoundingClientRect();
    const sx = ((ev.clientX - pt.left) / pt.width) * W;
    const i = Math.max(0, Math.min(n - 1, Math.floor((sx - m.l) / step)));
    const r = rows[i];
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("visibility", "visible");
    if (dot) { dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(r[key])); dot.setAttribute("visibility", "visible"); }
    tip.hidden = false;
    tip.style.left = `${(x(i) / W) * pt.width}px`;
    tip.style.top = `${(y(r[key]) / H) * pt.height}px`;
    tip.innerHTML = `<div class="d">${dayLabel(r.day, true)}</div><div class="v"><i style="background:${color}"></i>${format(r[key])} ${esc(label.toLowerCase())}</div>`;
  };
  const leave = () => { tip.hidden = true; xh.setAttribute("visibility", "hidden"); dot?.setAttribute("visibility", "hidden"); };
  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerleave", leave);
}

function dataTable(rows) {
  return `<details><summary>Show as table</summary><table><thead><tr><th>Day</th><th class="n">Visitors</th><th class="n">Plays</th><th class="n">Watch hours</th></tr></thead>
    <tbody>${rows.slice().reverse().map((r) => `<tr><td>${dayLabel(r.day, true)}</td><td class="n">${fmt(r.visitors)}</td><td class="n">${fmt(r.plays)}</td><td class="n">${fmt(r.watch_hours, 1)}</td></tr>`).join("")}</tbody></table></details>`;
}

function render() {
  const d = data, k = d.kpis, p = d.prev;
  $("#live").innerHTML = `<i></i>${fmt(d.live)} on the site now`;
  const pagesLabel = (r) => ({ "/": "Home", "/title": "Film details", "/watch": "Player", "/new": "New & Popular", "/genre": "Genre pages",
    "/genres": "Genre list", "/search": "Search", "/list": "My List" }[r.label] || r.label);
  $("#main").innerHTML = `
    <section class="kpis">
      ${kpi("Visitors", fmt(k.visitors), k.visitors, p.visitors)}
      ${kpi("Page views", fmt(k.pageviews), k.pageviews, p.pageviews)}
      ${kpi("Plays", fmt(k.plays), k.plays, p.plays)}
      ${kpi("Watch time", `${fmtHours(k.watch_hours)}${k.watch_hours >= 1 ? " h" : ""}`, k.watch_hours, p.watch_hours)}
      ${kpi("Visitors who pressed play", k.visitors ? `${fmt((k.viewers / k.visitors) * 100)}%` : "–", k.visitors ? k.viewers / k.visitors : 0, p.visitors ? p.viewers / p.visitors : 0)}
    </section>
    <section class="grid2">
      <div class="card"><h2>Visitors per day</h2><p class="sub">Unique browsers each day</p><div class="chart" id="cVisitors"></div></div>
      <div class="card"><h2>Plays per day</h2><p class="sub">Times someone started a film</p><div class="chart" id="cPlays"></div>${dataTable(d.daily)}</div>
    </section>
    <section class="card" style="margin-bottom:12px">
      <h2>Most-watched films</h2><p class="sub">"Avg. watched" is how far into the film viewers get on average</p>
      ${filmTable(d.top_films, "No one has played a film in this period yet.")}
    </section>
    <section class="card" style="margin-bottom:12px">
      <h2>Abandoned early</h2><p class="sub">Films with 3+ viewers where people stop in the first quarter. Check the video quality or the description.</p>
      ${filmTable(d.abandoned, "No film is being abandoned early. 🎉")}
    </section>
    <section class="grid2">
      <div class="card"><h2>Top searches</h2><p class="sub">What people look for</p>${barList(d.searches, { empty: "No searches yet." })}</div>
      <div class="card"><h2>Searches with no results</h2><p class="sub">Films people want that aren't in the free library</p>${barList(d.no_results, { empty: "Every search found something." })}</div>
    </section>
    <section class="grid2">
      <div class="card"><h2>Clicks to streaming services</h2><p class="sub">From “Where to watch” in New &amp; Popular</p>${barList(d.providers, { empty: "No click-outs yet." })}</div>
      <div class="card"><h2>Most-opened newer movies</h2><p class="sub">New &amp; Popular titles people looked at</p>
        ${d.new_titles.length ? `<table><thead><tr><th>Movie</th><th class="n">Opens</th><th class="n">Click-outs</th></tr></thead><tbody>
          ${d.new_titles.map((r) => `<tr><td class="name" title="${esc(r.label)}">${esc(r.label)}</td><td class="n">${fmt(r.n)}</td><td class="n">${fmt(r.clicks)}</td></tr>`).join("")}</tbody></table>` : `<p class="empty">Nothing yet.</p>`}
      </div>
    </section>
    <section class="grid3">
      <div class="card"><h2>Pages</h2><p class="sub">Page views by section</p>${barList(d.pages, { label: pagesLabel })}</div>
      <div class="card"><h2>Traffic sources</h2><p class="sub">Where visitors arrived from</p>${barList(d.referrers)}</div>
      <div class="card"><h2>Devices</h2><p class="sub">Visitors by device type</p>${barList(d.devices)}
        ${d.countries.length ? `<h2 style="margin-top:18px">Countries</h2><p class="sub">Needs Cloudflare in front of the site</p>${barList(d.countries)}` : ""}</div>
    </section>`;
  drawCharts();
}

function drawCharts() {
  if (!data) return;
  timeChart($("#cVisitors"), data.daily, "visitors", { color: "var(--series-visitors)", kind: "line", label: "Visitors" });
  timeChart($("#cPlays"), data.daily, "plays", { color: "var(--series-plays)", kind: "bar", label: "Plays" });
}

async function load() {
  try {
    const r = await fetch(`/api/admin/stats?days=${days}`, { cache: "no-store" });
    if (r.status === 401) { location.reload(); return; }
    if (!r.ok) throw new Error(`Error ${r.status}`);
    data = await r.json();
    render();
  } catch (e) {
    $("#main").innerHTML = `<p class="msg">${esc(e.message)}</p>`;
  }
}

document.querySelectorAll(".range button").forEach((b) => b.addEventListener("click", () => {
  days = Number(b.dataset.days);
  document.querySelectorAll(".range button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  load();
}));
let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(drawCharts, 150); });
load();
setInterval(load, 60000);
</script>
</body>
</html>
